<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">How a Fable 5.5 case gets listed</title>
  <desc id="desc">Four gates: the source itself names Fable 5.5, the original link resolves, it is not a rumor or repost, and it is listed once.</desc>
  <rect width="1200" height="280" rx="28" fill="#16130f"/>
  <text x="64" y="58" fill="#a3988c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">HOW AN ENTRY GETS IN</text>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" fill="#f6f1e8">
    <rect x="64" y="88" width="250" height="148" rx="16" fill="#221e19" stroke="#3a342c" stroke-width="1.5"/>
    <text x="84" y="128" fill="#c4552a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">01</text>
    <text x="84" y="168" font-size="22" font-weight="600">Source names</text>
    <text x="84" y="198" font-size="22" font-weight="600">Fable 5.5</text>

    <rect x="338" y="88" width="250" height="148" rx="16" fill="#221e19" stroke="#3a342c" stroke-width="1.5"/>
    <text x="358" y="128" fill="#c4552a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">02</text>
    <text x="358" y="168" font-size="22" font-weight="600">Original link</text>
    <text x="358" y="198" font-size="22" font-weight="600">still resolves</text>

    <rect x="612" y="88" width="250" height="148" rx="16" fill="#221e19" stroke="#3a342c" stroke-width="1.5"/>
    <text x="632" y="128" fill="#c4552a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">03</text>
    <text x="632" y="168" font-size="22" font-weight="600">Not a rumor</text>
    <text x="632" y="198" font-size="22" font-weight="600">or a repost</text>

    <rect x="886" y="88" width="250" height="148" rx="16" fill="#221e19" stroke="#3a342c" stroke-width="1.5"/>
    <text x="906" y="128" fill="#c4552a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">04</text>
    <text x="906" y="168" font-size="22" font-weight="600">Listed once</text>
    <text x="906" y="198" font-size="22" font-weight="600">under the author</text>
  </g>
</svg>
